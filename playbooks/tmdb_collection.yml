---
- name: Test zjleblanc.tmdb collection
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    tmdb_api_url: "{{ lookup('ansible.builtin.env', 'TMDB_API') }}"
    tmdb_api_key: "{{ lookup('ansible.builtin.env', 'TMDB_API_KEY') }}"
    tmdb_username: "{{ lookup('ansible.builtin.env', 'TMDB_USERNAME') }}"
    tmdb_password: "{{ lookup('ansible.builtin.env', 'TMDB_PASSWORD') }}"

  tasks:
    - name: Get favorite movies
      register: r_fav_movies
      zjleblanc.tmdb.favorite_movies_info:
        api_url: "{{ tmdb_api_url }}"
        api_key: "{{ tmdb_api_key }}"
        username: "{{ tmdb_username }}"
        password: "{{ tmdb_password }}"
        account_id: "20850360"

    - name: Debug response
      ansible.builtin.debug:
        var: r_fav_movies.favorites

    - name: Add Dune to favorites
      register: r_add_dune
      zjleblanc.tmdb.favorite_movies:
        api_url: "{{ tmdb_api_url }}"
        api_key: "{{ tmdb_api_key }}"
        username: "{{ tmdb_username }}"
        password: "{{ tmdb_password }}"
        account_id: "20850360"
        movie_id: "438631"

    - name: Debug response
      ansible.builtin.debug:
        var: r_add_dune.favorites

    - name: Remove Dune from favorites
      register: r_del_dune
      zjleblanc.tmdb.favorite_movies:
        api_url: "{{ tmdb_api_url }}"
        api_key: "{{ tmdb_api_key }}"
        username: "{{ tmdb_username }}"
        password: "{{ tmdb_password }}"
        account_id: "20850360"
        movie_id: "438631"
        state: absent

    - name: Debug response
      ansible.builtin.debug:
        var: r_del_dune.favorites
